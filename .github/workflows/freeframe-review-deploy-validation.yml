name: FreeFrame Review Deploy Validation

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  plane-web-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare compose environment
        run: |
          cp .env.example .env
          cp apps/api/.env.example apps/api/.env
          sed -i 's|^VITE_FREEFRAME_REVIEW_EMBED_URL=.*|VITE_FREEFRAME_REVIEW_EMBED_URL="https://freeframe.staging.example/integrations/plane/review"|' .env
      - name: Validate compose build argument
        run: |
          docker compose config > /tmp/plane-compose.yml
          grep -F 'VITE_FREEFRAME_REVIEW_EMBED_URL: https://freeframe.staging.example/integrations/plane/review' /tmp/plane-compose.yml
      - name: Build tagged Plane web image
        run: |
          docker build \
            --file apps/web/Dockerfile.web \
            --build-arg VITE_FREEFRAME_REVIEW_EMBED_URL=https://freeframe.staging.example/integrations/plane/review \
            --tag plane-web-review-test:latest \
            .
      - name: Extract Plane web bundle
        run: |
          container_id=$(docker create plane-web-review-test:latest)
          docker cp "$container_id":/usr/share/nginx/html /tmp/plane-web
          docker rm -f "$container_id"
      - name: Capture FreeFrame bundle strings
        if: always()
        run: |
          mkdir -p /tmp/plane-web
          grep -R -n -i 'freeframe' /tmp/plane-web > /tmp/freeframe-bundle-diagnostics.txt || true
          find /tmp/plane-web -maxdepth 3 -type f | sort >> /tmp/freeframe-bundle-diagnostics.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plane-freeframe-bundle-diagnostics
          path: /tmp/freeframe-bundle-diagnostics.txt
          if-no-files-found: error
      - name: Verify URL is compiled into Vite bundle
        run: grep -R -F 'freeframe.staging.example' /tmp/plane-web
