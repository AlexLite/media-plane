name: FreeFrame Asset Picker Validation

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare test environment
        run: cp apps/api/.env.example apps/api/.env
      - name: Run backend validation
        run: |
          docker compose -f docker-compose-test.yml run --rm --build api-tests \
            /bin/sh -c "python -m ruff check plane/app/views/issue/freeframe_review_catalog.py plane/tests/contract/app/test_freeframe_review_catalog.py && python manage.py makemigrations --check --dry-run && python manage.py migrate --noinput && pytest -q plane/tests/contract/app/test_freeframe_review_session.py plane/tests/contract/app/test_freeframe_review_catalog.py"
      - name: Tear down test services
        if: always()
        run: docker compose -f docker-compose-test.yml down -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format and lint changed components
        run: |
          pnpm exec oxfmt apps/web/core/components/issues/issue-detail/freeframe-review-asset-picker.tsx apps/web/core/components/issues/issue-detail/freeframe-review-embed.tsx
          pnpm exec oxlint --fix --deny-warnings apps/web/core/components/issues/issue-detail/freeframe-review-asset-picker.tsx apps/web/core/components/issues/issue-detail/freeframe-review-embed.tsx
          pnpm exec oxfmt apps/web/core/components/issues/issue-detail/freeframe-review-asset-picker.tsx apps/web/core/components/issues/issue-detail/freeframe-review-embed.tsx
      - name: Typecheck web and dependencies
        run: pnpm turbo run check:types --filter=web...
      - name: Build web and dependencies
        run: pnpm turbo run build --filter=web...
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formatted-freeframe-asset-picker
          path: |
            apps/web/core/components/issues/issue-detail/freeframe-review-asset-picker.tsx
            apps/web/core/components/issues/issue-detail/freeframe-review-embed.tsx
          if-no-files-found: error
