name: i18n hardcoded string check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "preview"
    types:
      - "opened"
      - "synchronize"
      - "reopened"
      - "ready_for_review"
    paths:
      - "apps/web/**/*.ts"
      - "apps/web/**/*.tsx"
      - "apps/admin/**/*.ts"
      - "apps/admin/**/*.tsx"
      - "apps/space/**/*.ts"
      - "apps/space/**/*.tsx"
      - "packages/ui/**/*.ts"
      - "packages/ui/**/*.tsx"
      - "packages/editor/**/*.ts"
      - "packages/editor/**/*.tsx"
      - "scripts/audit-hardcoded.mjs"
      - "packages/i18n/src/locales/en/**/*.json"
      - "packages/i18n/src/constants/namespaces.ts"
      - ".github/workflows/i18n-hardcoded-check.yml"
  push:
    branches:
      - "preview"
    paths:
      - "apps/web/**/*.ts"
      - "apps/web/**/*.tsx"
      - "apps/admin/**/*.ts"
      - "apps/admin/**/*.tsx"
      - "apps/space/**/*.ts"
      - "apps/space/**/*.tsx"
      - "packages/ui/**/*.ts"
      - "packages/ui/**/*.tsx"
      - "packages/editor/**/*.ts"
      - "packages/editor/**/*.tsx"
      - "scripts/audit-hardcoded.mjs"
      - "packages/i18n/src/locales/en/**/*.json"
      - "packages/i18n/src/constants/namespaces.ts"
      - ".github/workflows/i18n-hardcoded-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hardcoded-check:
    name: check:hardcoded
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.18.0"

      - name: Check changed frontend files
        run: node scripts/audit-hardcoded.mjs --changed --base "$BASE_REF" --ci
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}

      - name: Test audit fixtures
        run: node --test scripts/tests/audit-hardcoded.test.mjs
