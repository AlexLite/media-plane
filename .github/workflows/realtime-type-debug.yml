name: Realtime type debug

on:
  pull_request:
    branches:
      - develop
    types:
      - synchronize

jobs:
  capture:
    if: github.head_ref == 'feat/issue-realtime-sse'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
      TURBO_SCM_HEAD: ${{ github.sha }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50
          filter: blob:none
      - uses: actions/setup-node@v6
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --affected
      - name: Capture type output
        run: |
          set +e
          pnpm turbo run check:types --affected > realtime-type-errors.txt 2>&1
          status=$?
          cat realtime-type-errors.txt
          echo "$status" > realtime-type-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: realtime-type-errors
          path: |
            realtime-type-errors.txt
            realtime-type-status.txt
          if-no-files-found: error
