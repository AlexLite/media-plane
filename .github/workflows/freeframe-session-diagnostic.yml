name: FreeFrame Session Diagnostic

on:
  pull_request:
    branches:
      - feat/freeframe-review-issue-embed

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Show migration base
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${REPOSITORY}/tarball/${REF}" -o repo.tar.gz
          mkdir repo
          tar -xzf repo.tar.gz -C repo --strip-components=1
          find repo/apps/api/plane/db/migrations -maxdepth 1 -type f -name '*.py' -printf '%f\n' | sort | tail -20
