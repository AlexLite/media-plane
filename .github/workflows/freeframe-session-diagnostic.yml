name: FreeFrame Session Diagnostic

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare test environment
        run: cp apps/api/.env.example apps/api/.env
      - name: Run migration and contract checks
        run: |
          docker compose -f docker-compose-test.yml run --rm --build api-tests \
            /bin/sh -c "python manage.py makemigrations --check --dry-run && python manage.py migrate --noinput && pytest -q plane/tests/contract/app/test_freeframe_review_session.py"
      - name: Tear down test services
        if: always()
        run: docker compose -f docker-compose-test.yml down -v
