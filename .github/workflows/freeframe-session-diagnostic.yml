name: FreeFrame Session Diagnostic

on:
  push:
    branches:
      - feat/freeframe-review-session-api

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Show migration base
        run: |
          find apps/api/plane/db/migrations -maxdepth 1 -type f -name '*.py' -printf '%f\n' | sort | tail -20
